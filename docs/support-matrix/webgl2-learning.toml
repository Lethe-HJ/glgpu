[profile]
name = "CpuWebGl2LearningTrack"
schema_version = 1
standard = false
conformant = false
implementation = "learning-slice"
goal = "pure CPU from-scratch WebGL2-style stack for learning"
backend = "cpu-from-scratch"
separate_from_webgpu_crates = true
presentation = "none; Canvas2D present is not wired"
api_surface = "Rust-native learning slice inside glgpu-webgl only"
product_phase = "P7a+ remains the production gate; this file does not move it"
banner = "CpuWebGl2LearningTrack — NOT WEBGL CONFORMANT"
host_webgl = false
host_webgpu = false
navigator_gpu = false
webgl_rendering_context = false
jit = false
compile_path = "ESSL source -> AST -> self-authored bytecode IR -> CPU interpreter"
document = "docs/webgl2-learning-track.zh-CN.md"
decision = "docs/adr/0003-parallel-webgl2-learning-track.md"

[baseline]
webgl = "Khronos WebGL 2.0.0, 11 April 2017"
webgl_url = "https://registry.khronos.org/webgl/specs/2.0.0/"
webgl_editors_draft = "https://registry.khronos.org/webgl/specs/latest/2.0/"
essl = "OpenGL ES Shading Language 3.00.6, 29 January 2016"
essl_url = "https://registry.khronos.org/OpenGL/specs/es/3.0/GLSL_ES_Specification_3.00.pdf"
oracle = "Khronos glslang 16.6.0"
oracle_url = "https://github.com/KhronosGroup/glslang/releases/tag/16.6.0"
oracle_role = "external accept/reject reference; not linked or invoked by glgpu-webgl"
naga_is_essl_frontend = false

[implemented]
api = [
    "RGBA8 clear of the CPU learning framebuffer",
]

[partial]
api = [
    "CPU learning context that owns an RGBA8 framebuffer and is not a WebGL2RenderingContext",
    "WebGL clip volume -w <= x, y, z <= w, including a triangle that crosses one clip plane",
    "bottom-left window coordinates after the perspective divide",
    "one triangle whose clip position and color come from CPU interpreter outputs",
    "transitional top-left framebuffer storage so the P0 picture keeps the WebGPU demo orientation: storage_y = height - window_y",
    "screen-space triangle with vertex colors and sample-center barycentrics, for vertices already in storage pixels",
    "ESSL 3.00 subset lexer, parser, and AST: #version 300 es, uniform/in/out float, void functions, float locals, assignments, and one multiplication",
    "self-authored bytecode IR with a source span on each instruction, including uniform, input, output, and mul ops",
    "CPU interpreter for load_const, move, mul, and uniform/input/output traffic, recording locals and interface values after each step",
]

[not_started]
api = [
    "drawArrays and drawElements",
    "mutable WebGL state machine",
    "depth test",
    "vec4, gl_Position, and perspective-correct fragment varyings",
    "ESSL type checking beyond the subset",
    "glslang oracle wired into CI",
    "machine-code JIT",
    "single-step debugger UI",
    "readPixels",
    "explicit present to Canvas 2D",
    "JavaScript getContext facade",
    "browser-native WebGL or WebGPU backend",
    "lit rotating cube",
]

[intentionally_different]
api = [
    "framebuffer row 0 is the top image row so the P0 picture matches the WebGPU demo; WebGL window y is bottom-left and storage_y = height - window_y. This storage order is transitional until present exists",
    "coverage is this crate's sample-center barycentric test, not a bit-identical port of the WebGPU rasterizer",
    "clip Z is -w..w, so a triangle with negative clip Z still rasterizes here. There is no depth buffer",
    "the shader subset is scalar float only. Vertex outputs use v_clip_* and v_color_* because there is no vec4 or gl_Position",
    "fragment color is barycentric in storage pixels. Attributes created by clipping are lerped in clip space",
    "unassigned locals and unbound uniforms fail instead of becoming WebGL undefined values",
    "reading a shader output is rejected in this subset",
]

[notes]
scope = "Learning slice inside glgpu-webgl. Partial rows are not WebGL entry points. drawArrays is not started."
essl = "Do not treat Naga's desktop GLSL frontend as ESSL 3.00. glslang 16.6.0 is the accept/reject reference and is not invoked yet."
coordinates = "Window space is bottom-left and clip Z is -w..w. Stored row 0 is still the top image row."
debugger = "Instruction spans, per-step local snapshots, and per-step uniform/input/output values are the debugger hook. There is no pause control or UI."
