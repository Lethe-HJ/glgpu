<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GLGPU WebGPU Debug Lab</title>
    <link rel="stylesheet" href="./api-nav.css">
  </head>
  <body>
    <header class="site-nav">
      <div class="site-nav-inner">
        <div class="site-nav-brand">GLGPU</div>
        <nav class="api-switch" aria-label="图形栈">
          <span aria-current="page">WebGPU</span>
          <a href="./webgl.html">WebGL</a>
        </nav>
        <p class="site-nav-note">切换会重新加载页面</p>
      </div>
    </header>
    <main id="app">正在载入 GLGPU Rust/Wasm…</main>
    <!--
      相对 URL 同时覆盖本地 `/`（cargo xtask serve）和 GitHub Pages 项目站点 `/<repo>/`。
      不要添加 base 元素：它会改变本地与 Pages 的解析结果。
      coop-coep.js 仅在请求 MT 且页面尚未跨源隔离时注册；本地服务器已经发送 COOP/COEP。
    -->
    <script src="./coop-coep.js"></script>
    <script type="module">
      import { openPresentWorker } from "./present-slots.js";

      const wantsThreads = new URLSearchParams(location.search).get("threads") === "1";
      const maxRayonWorkers = 8;

      let reloadingForIsolation = false;
      try {
        const isolation = await (window.glgpuIsolationReady ?? Promise.resolve(null));
        reloadingForIsolation = Boolean(isolation && isolation.reloading);
      } catch (error) {
        console.warn("GLGPU isolation shim failed; continuing", error);
      }

      function supportsWasmThreads() {
        if (
          !globalThis.crossOriginIsolated ||
          typeof SharedArrayBuffer === "undefined" ||
          (navigator.hardwareConcurrency || 1) <= 1
        ) {
          return false;
        }
        try {
          const memory = new WebAssembly.Memory({
            initial: 1,
            maximum: 1,
            shared: true,
          });
          return memory.buffer instanceof SharedArrayBuffer;
        } catch {
          return false;
        }
      }

      async function bootSingleThread() {
        const wasm = await import("./pkg/glgpu_web.js");
        await wasm.default();
        wasm.boot(false);
      }

      async function bootMultiThread() {
        const wasm = await import("./pkg-mt/glgpu_web.js");
        await wasm.default();
        const logicalCpus = navigator.hardwareConcurrency || 1;
        await wasm.initThreadPool(Math.min(maxRayonWorkers, Math.max(1, logicalCpus - 1)));
        wasm.boot(true);
      }

      if (!wantsThreads) {
        const present = openPresentWorker("./webgpu-worker.js");
        window.glgpuQueueTriangle = (coords, x, y) =>
          present.queueCommand((info) => {
            if (coords.length !== 21) {
              throw new Error("triangle command must hold 21 floats");
            }
            new Float32Array(info.buffer, info.commandAddr, 21).set(coords);
            const selected = new Uint32Array(info.buffer, info.commandAddr + 84, 2);
            selected[0] = x;
            selected[1] = y;
            Atomics.store(new Int32Array(info.buffer), info.commandLenAddr / 4, 92);
          }, { kind: "triangle" });
      }

      if (!reloadingForIsolation) {
        try {
          if (wantsThreads && supportsWasmThreads()) {
            try {
              await bootMultiThread();
            } catch (error) {
              console.warn("GLGPU MT boot failed; falling back to ST", error);
              await bootSingleThread();
            }
          } else {
            if (wantsThreads) {
              console.warn("GLGPU MT requested without cross-origin isolation; using ST");
            }
            await bootSingleThread();
          }
        } catch (error) {
          console.error("GLGPU boot failed", error);
          document.querySelector("#app").textContent = `GLGPU 启动失败：${error}`;
        }
      }
    </script>
  </body>
</html>
