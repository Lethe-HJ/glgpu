[lock]
created = "2026-08-22"
profile = "P0"
complete = false
policy = "Updates require an ADR plus shader snapshots, golden images, and browser smoke tests."
unlocked_items = [
    "WHATWG HTML/Canvas exact commit",
    "GPUWeb CTS exact commit",
    "WebGPU WebIDL content hash",
]

[webgpu]
status = "W3C Candidate Recommendation Draft"
date = "2026-06-23"
url = "https://www.w3.org/TR/2026/CRD-webgpu-20260623/"

[wgsl]
status = "W3C Candidate Recommendation Draft"
date = "2026-08-17"
url = "https://www.w3.org/TR/2026/CRD-WGSL-20260817/"

[canvas]
status = "WHATWG HTML Living Standard; exact commit pending P0 exit"
url = "https://html.spec.whatwg.org/multipage/canvas.html"

[cts]
status = "Not yet locked; standard facade is unsupported in P0"
url = "https://gpuweb.github.io/cts/"

[toolchain]
rust = "1.93.0"
wasm_target = "wasm32-unknown-unknown"
wasm_pack = "0.14.0"
wasm_bindgen = "0.2.127"
js_sys = "0.3.104"
web_sys = "0.3.104"
wasm_bindgen_rayon = "1.3.0"
rayon = "1.12.0"
naga = "30.0.1"

[shader_validation]
naga_optional_capabilities = "empty"
wgsl_execution = false
purpose = "core syntax and semantic validation only"

[profiles.single_thread]
required = true
wasm_shared_memory = false

[profiles.multi_thread]
required = false
status = "P0 gate"
nightly = "nightly-2025-11-15"
wasm_shared_memory = true
requires_cross_origin_isolation = true
requires_pinned_nightly_build_std = true
max_workers = 8

[deferred.webgl]
production_phase = "P7a+"
p0_time_budget_max_percent = 20
allowed_p0_work = [
    "hand-lowered ESSL-to-project-IR fixtures",
    "dual RasterConvention goldens",
    "API-neutral packet and trace provenance fixtures",
]
forbidden_p0_work = [
    "ESSL parser",
    "WebGL state machine",
    "WebGL JavaScript facade",
]

[webgl_mock]
status = "webgl-mock"
goal = "webgl-mock: WebGL2-style visualization running on the CPU; not native WebGL or native WebGPU"
stack = "glgpu-webgl only; no dependency on webgpu-mock crates"
debug_page = "web/webgl.html boots crates/glgpu-webgl-web on the main thread; that shell depends only on glgpu-webgl and is not a native WebGL context"
threading_target = "decided 2026-10-28: one SharedArrayBuffer, double buffered. Front slot for main-thread Canvas 2D present, back slot for Worker raster. The back slot is the logical drawing buffer and is authoritative for raster results, hash, tests, and pixel debugging. Handoff uses Atomics. Do not transfer away the sole buffer. No extra full-frame framebuffer copied into the SAB each frame, except later for an offscreen FBO or a non-present size. Triple buffering is not the default. No OffscreenCanvas. No copied postMessage of pixel payloads. A zero-copy transfer of a duplicate snapshot is not the primary path"
threading_current = "when crossOriginIsolated, glgpu-webgl-worker draws the back slot in one SharedArrayBuffer and the page presents the front slot; without SharedArrayBuffer the demo stays on the main thread. drawArrays remains NotStarted. There is no triple buffer and no OffscreenCanvas"
host_webgl = false
host_webgpu = false
navigator_gpu = false
webgl_rendering_context = false
conformant = false
jit = false
compile_path = "ESSL source -> AST -> self-authored bytecode IR -> CPU interpreter"
changes_product_order = false
production_phase_unchanged = "P7a+"
document = "docs/adr/0003-parallel-webgl-mock.md"
support_matrix = "docs/support-matrix/webgl-mock.toml"

[webgl_mock.baseline]
webgl = "Khronos WebGL 2.0.0"
webgl_date = "2017-04-11"
webgl_url = "https://registry.khronos.org/webgl/specs/2.0.0/"
webgl_editors_draft = "https://registry.khronos.org/webgl/specs/latest/2.0/"
essl = "OpenGL ES Shading Language 3.00.6"
essl_date = "2016-01-29"
essl_url = "https://registry.khronos.org/OpenGL/specs/es/3.0/GLSL_ES_Specification_3.00.pdf"
oracle = "Khronos glslang"
oracle_version = "16.6.0"
oracle_url = "https://github.com/KhronosGroup/glslang/releases/tag/16.6.0"
oracle_role = "external accept/reject reference; not linked or invoked"
naga_is_essl_frontend = false
