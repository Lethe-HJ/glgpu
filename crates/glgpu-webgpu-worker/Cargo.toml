[package]
name = "glgpu-webgpu-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Worker-side webgpu-mock kernel. Color is published into a double-buffered slot. Depth stays in the device framebuffer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glgpu-core = { path = "../glgpu-core" }
glgpu-trace = { path = "../glgpu-trace" }
glgpu-webgpu = { path = "../glgpu-webgpu" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
