[package]
name = "glgpu-webgl-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Wasm demo page for webgl-mock. Not a native WebGL context. Presents the worker front slot when SharedArrayBuffer exists, and otherwise rasterizes on the main thread."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glgpu-webgl = { path = "../glgpu-webgl" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "Storage",
    "Window",
    "console",
] }
