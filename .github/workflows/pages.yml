# Build the WebGPU ST/MT packages and the WebGL learning page, then publish web/.
# Pages cannot set COOP/COEP. web/coop-coep.js adds those headers for /?threads=1.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install locked wasm-pack and wasm-bindgen
        run: |
          set -euo pipefail
          install_verified() {
            local url="$1"
            local sha="$2"
            local archive="$3"
            local binary="$4"
            curl -fsSL "$url" -o "$archive"
            echo "$sha  $archive" | sha256sum -c -
            local dir
            dir="$(mktemp -d)"
            tar -xzf "$archive" -C "$dir"
            local bin
            bin="$(find "$dir" -type f -name "$binary" -print -quit)"
            test -n "$bin"
            install -m 0755 "$bin" "$HOME/.cargo/bin/$binary"
          }
          mkdir -p "$HOME/.cargo/bin"
          export PATH="$HOME/.cargo/bin:$PATH"
          install_verified \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz" \
            "278a8d668085821f4d1a637bd864f1713f872b0ae3a118c77562a308c0abfe8d" \
            /tmp/wasm-pack.tar.gz \
            wasm-pack
          install_verified \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz" \
            "61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a" \
            /tmp/wasm-bindgen.tar.gz \
            wasm-bindgen
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          hash -r
          test "$(wasm-pack --version)" = "wasm-pack 0.14.0"
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.127"

      - name: Test the local server contract
        run: cargo test -p xtask

      - name: Build the stable single-thread package
        run: cargo xtask build-web --release

      - name: Build the WebGL learning-track package
        run: cargo xtask build-web --release --crate crates/glgpu-webgl-web --out-dir web/pkg-webgl --out-name glgpu_webgl_web

      - name: Install the pinned multi-thread nightly
        run: rustup toolchain install nightly-2025-11-15 --profile minimal --component rust-src --target wasm32-unknown-unknown

      - name: Build the multi-thread package
        run: cargo xtask build-web-mt

      - name: Check Pages assets and relative URLs
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/webgl.html
          test -f web/api-nav.css
          test -f web/coop-coep.js
          test -f web/.nojekyll
          test -f web/pkg/glgpu_web.js
          test -f web/pkg/glgpu_web_bg.wasm
          test -f web/pkg-mt/glgpu_web.js
          test -f web/pkg-mt/glgpu_web_bg.wasm
          test -f web/pkg-webgl/glgpu_webgl_web.js
          test -f web/pkg-webgl/glgpu_webgl_web_bg.wasm
          find web/pkg-mt -name workerHelpers.no-bundler.js | grep -q .
          grep -q './pkg/glgpu_web.js' web/index.html
          grep -q './pkg-mt/glgpu_web.js' web/index.html
          grep -q './coop-coep.js' web/index.html
          grep -q './webgl.html' web/index.html
          grep -q './pkg-webgl/glgpu_webgl_web.js' web/webgl.html
          grep -q './index.html' web/webgl.html
          grep -q './api-nav.css' web/index.html
          grep -q './api-nav.css' web/webgl.html
          grep -q 'Cross-Origin-Opener-Policy' web/coop-coep.js
          grep -q 'Cross-Origin-Embedder-Policy' web/coop-coep.js
          grep -q 'require-corp' web/coop-coep.js
          if grep -R -n -E 'from "/|import\("/' web/index.html web/webgl.html web/pkg web/pkg-mt web/pkg-webgl --include='*.html' --include='*.js'; then
            echo "found an absolute import; project Pages need relative URLs" >&2
            exit 1
          fi
          if grep -n '<base' web/index.html web/webgl.html; then
            echo "a base tag would retarget local and Pages URLs differently" >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
